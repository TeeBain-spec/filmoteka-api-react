# Blueprint для Render.com: New → Blueprint → выбрать этот репозиторий → Deploy.
services:
  - type: web
    name: filmoteka
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KINOPOISK_API_KEY   # ключ «ПоискКино» (Telegram @poiskkinodev_bot); вводится в панели Render
        sync: false
      - key: KINOPOISK_SEED_TOP  # сколько фильмов топа Кинопоиска загрузить в пустую базу
        value: "100"
